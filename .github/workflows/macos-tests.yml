name: macOS tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26, not macos-15: TextInputBubbleView compiles NSGlassEffectView
    # behind an `if #available(macOS 26.0, *)` guard, and a runtime guard still
    # needs the symbol at compile time. Xcode 16.4 on the macos-15 image has no
    # macOS 26 SDK, so the whole target fails with "cannot find
    # 'NSGlassEffectView' in scope".
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # lfs: the app icons and other Assets.xcassets images are LFS-tracked.
      # Without it actool is handed the pointer text, the asset catalog fails
      # to compile, and the GeneratedAssetSymbols.swift it produces takes the
      # whole Puck target's compile down with it -- tests never run.
      - uses: actions/checkout@v4
        with:
          lfs: true
      # Puck.xcodeproj is generated from project.yml, not committed.
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Run the Puck test suite
        run: sh pet-app/scripts/test.sh
